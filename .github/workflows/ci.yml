name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanner:
    name: Scanner (Core + testler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derle
        run: dotnet build scanner/HapiScanner.sln -c Release -warnaserror

      - name: Testler
        run: dotnet test scanner/HapiScanner.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Arayuzu derle (Windows hedefi, Linux uzerinde)
        run: >
          dotnet build scanner/HapiScanner.App/HapiScanner.App.csproj
          -c Release -p:EnableWindowsTargeting=true -p:PublishSingleFile=false -p:SelfContained=false

      - name: 3B model onizlemesi
        run: |
          python -m pip install --quiet pillow numpy
          python tools/model_onizleme.py onizleme

      - uses: actions/upload-artifact@v4
        with:
          name: model-onizleme
          path: onizleme/*.png
          retention-days: 14

  arayuz-windows:
    name: Arayuz + testler (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Arayuzu derle
        run: dotnet build scanner/HapiScanner.App/HapiScanner.App.csproj -c Debug

      - name: Testler
        run: dotnet test scanner/HapiScanner.sln -c Release

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bagimliliklar
        run: python -m pip install --quiet -r backend/requirements-dev.txt

      - name: Testler
        working-directory: backend
        run: python -m pytest -q

      - name: Statik analiz
        run: |
          python -m pip install --quiet ruff
          ruff check backend tools

  plugin:
    name: Velocity eklentisi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Derle ve test et
        run: mvn -B -f plugin/pom.xml verify

      - name: Eklenti tanimi jar icinde mi
        run: |
          jar=$(ls plugin/target/HapiVerify-*.jar | head -1)
          unzip -l "$jar" | grep -q velocity-plugin.json \
            || { echo "velocity-plugin.json jar icinde yok"; exit 1; }

  kurallar:
    name: Kural paketleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Paket yapisi
        run: python tools/kural_paketi_denetle.py rules
